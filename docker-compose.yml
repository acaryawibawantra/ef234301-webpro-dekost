services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dekost
      POSTGRES_USER: dekost
      POSTGRES_PASSWORD: dekost
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dekost -d dekost"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/dekost
      DB_USER: dekost
      DB_PASSWORD: dekost
      PORT: ${PORT:-8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@kos.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env or the environment}
      WA_NUMBER: "000000000000"
    ports:
      - "${PORT:-8080}:${PORT:-8080}"

volumes:
  pgdata:
